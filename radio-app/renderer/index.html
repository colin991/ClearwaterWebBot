<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src ws: wss:; media-src 'self' blob: mediastream:">
  <title>Clearwater Radio</title>
  <link rel="stylesheet" href="radio.css">
</head>
<body>
  <div id="radio" class="radio">
    <div class="antenna"></div>

    <div class="top">
      <div class="knob-wrap">
        <div id="vol" class="knob" title="Volume: drag or scroll"><i></i></div>
        <span>VOL</span>
      </div>
      <div class="knob-wrap tall">
        <div id="ch" class="knob" title="Channel: click to change"><i></i></div>
        <span>CH</span>
      </div>
      <button id="emer" class="emer" title="Emergency: send your panic to every radio"><span>EMER</span></button>
    </div>

    <div class="brand">CLEARWATER</div>

    <div class="body-row">
      <button id="pttSide" class="side-ptt" title="Hold to talk"><span>PTT</span></button>
      <button id="deaf" class="deaf" title="Deafen yourself">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 14v-2a8 8 0 0 1 16 0v2" />
          <rect x="3" y="14" width="4" height="6" rx="1.5" />
          <rect x="17" y="14" width="4" height="6" rx="1.5" />
          <line x1="3" y1="3" x2="21" y2="21" />
        </svg>
      </button>
      <div class="lcd">
        <div class="lcd-status">
          <span class="sig" id="lcdSig"><i></i><i></i><i></i><i></i></span>
          <span id="lcdLeft" class="lcd-title">RADIO</span>
          <span id="lcdRight" class="lcd-flag"></span>
          <span class="bat"><i></i></span>
        </div>
        <div class="lcd-date"><span id="lcdDate"></span><span id="lcdTime"></span></div>
        <div id="lcdBody" class="lcd-body"></div>
        <div class="lcd-foot"><span id="softLeftLabel">MENU</span><span id="softRightLabel">MSGS</span></div>
      </div>
    </div>

    <div class="nav">
      <button id="softL" class="pkey gearkey" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg></button>
      <div class="dpad">
        <button id="up" class="dir up" title="Up"></button>
        <button id="left" class="dir left" title="Left"></button>
        <button id="right" class="dir right" title="Right"></button>
        <button id="down" class="dir down" title="Down"></button>
      </div>
      <button id="softR" class="pkey homekey" title="Home: radio screen, press again for all units"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 10v9.5h5v-5h3v5h5V10" /></svg></button>
      <button id="ok" class="pkey okkey" title="Select / menu">OK</button>
      <button id="back" class="pkey backkey" title="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2" /></svg></button>
    </div>

    <div class="keypad">
      <button data-key="1">1<small>.?</small></button>
      <button data-key="2">2<small>ABC</small></button>
      <button data-key="3">3<small>DEF</small></button>
      <button data-key="4">4<small>GHI</small></button>
      <button data-key="5">5<small>JKL</small></button>
      <button data-key="6">6<small>MNO</small></button>
      <button data-key="7">7<small>PQRS</small></button>
      <button data-key="8">8<small>TUV</small></button>
      <button data-key="9">9<small>WXYZ</small></button>
      <button data-key="*" class="fn">*<small>BACK</small></button>
      <button data-key="0">0<small>&#9251;</small></button>
      <button data-key="#" class="fn">#<small>OK</small></button>
    </div>

    <div class="bottom">
      <button id="quit" class="quit" title="Shut off the radio">QUIT</button>
      <div class="lamps">
        <span id="lampTx" class="lamp">TX</span>
        <span id="lampRx" class="lamp">RX</span>
        <span id="lampMic" class="lamp dot">MIC</span>
      </div>
    </div>
  </div>
  <script src="panic-sound.js"></script>
  <script src="radio.js"></script>
</body>
</html>
