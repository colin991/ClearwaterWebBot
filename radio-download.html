<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04121c">
<title>Download | Clearwater Radio</title>
<meta name="description" content="Download Clearwater Radio, the push-to-talk radio overlay for Clearwater.">
<link rel="icon" type="image/png" href="/assets/clearwater-logo.png">
<link rel="apple-touch-icon" href="/assets/clearwater-logo.png">
<style>
  /* cwpcso.com/radio/download, in the Clearwater radio's colours (same as the web radio and radio staff page). */
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px);
    background: radial-gradient(120% 60% at 50% 0%, #0b3348 0%, transparent 70%), #04121c;
    color: #e8f4f8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45;
  }
  .card { width: 100%; max-width: 520px; padding: 32px; border-radius: 16px; background: #0a2130; border: 1px solid #1b4258; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 52px; height: 52px; flex: none; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; }
  .tagline { margin: 4px 0 0; color: #8fb3c4; font-size: 15px; }
  .download {
    display: block; margin-top: 24px; text-align: center; padding: 14px 16px; border-radius: 10px;
    background: #1c5aa6; color: #fff; font-weight: 700; font-size: 16px; text-decoration: none;
  }
  .download:hover, .download:focus-visible { background: #2468bd; }
  .alt { margin: 14px 0 24px; text-align: center; font-size: 14px; color: #8fb3c4; }
  a { color: #2fc4c8; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 14px; padding-top: 18px; border-top: 1px solid #1b4258; }
  dt { color: #8fb3c4; }
  dd { margin: 0; text-align: right; }
  dd.hash { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <img src="/assets/clearwater-logo.png" alt="">
    <div>
      <h1>Clearwater Radio</h1>
      <p class="tagline">Push-to-talk radio overlay for Clearwater.</p>
    </div>
  </div>

  <a class="download" href="https://github.com/colin991/ClearwaterWebBot/releases/latest/download/ClearwaterRadio-Setup.exe">Download for Windows</a>
  <p class="alt">On a Mac or your phone? Use the <a href="/radio">web radio</a>.</p>

  <dl>
    <dt>Version</dt><dd id="version">…</dd>
    <dt>Released</dt><dd id="released">…</dd>
    <dt>File size</dt><dd id="size">…</dd>
    <dt>SHA-256</dt><dd class="hash" id="sha">…</dd>
  </dl>
</main>
<script>
(async () => {
  const set = (id, text) => { document.getElementById(id).textContent = text; };
  try {
    const response = await fetch('https://api.github.com/repos/colin991/ClearwaterWebBot/releases/latest', { headers: { Accept: 'application/vnd.github+json' } });
    if (!response.ok) throw new Error(String(response.status));
    const release = await response.json();
    const installer = (release.assets || []).find((asset) => asset.name === 'ClearwaterRadio-Setup.exe');
    if (!installer) throw new Error('no installer');
    set('version', String(release.tag_name || '').replace(/^radio-v/, '') || '—');
    set('released', release.published_at ? new Date(release.published_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '—');
    set('size', `${(installer.size / 1024 / 1024).toFixed(1)} MB`);
    set('sha', String(installer.digest || '').replace(/^sha256:/, '') || '—');
  } catch {
    for (const id of ['version', 'released', 'size', 'sha']) set(id, '—');
  }
})();
</script>
</body>
</html>
