<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clearwater Phone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="launcher.css" />
  </head>
  <body>
    <div class="cine" id="cine">
      <div class="cine-sky"></div>
      <div class="cine-aurora"></div>
      <div class="cine-stars"></div>
      <div class="cine-glow"></div>
      <div class="cine-city"></div>
      <div class="cine-water"></div>
      <div class="cine-vignette"></div>
      <div class="cine-stage">
        <div class="cine-mark" aria-hidden="true">
          <svg viewBox="0 0 120 120" fill="none">
            <circle cx="60" cy="28" r="11" stroke="currentColor" stroke-width="3.5"/>
            <path d="M60 39V94M60 94C60 94 34 79 34 56M60 94C60 94 86 79 86 56" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M40 52H80" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="cine-kicker">Clearwater Roleplay</p>
        <h1 class="cine-title">Phone</h1>
        <p class="cine-sub">Always-on overlay for ER:LC · Wallet, Internet, Maps, Find My</p>
        <button type="button" class="cine-launch" id="launch">Launch Phone</button>
        <button type="button" class="cine-quit" id="quit">Quit</button>
        <p class="cine-hint">F8 hides the overlay after launch</p>
      </div>
    </div>
    <script src="launcher.js"></script>
  </body>
</html>
