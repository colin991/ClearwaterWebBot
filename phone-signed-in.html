<!doctype html>
<html lang="en" class="site-public">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03070d" />
    <title>Signed in · Clearwater Phone</title>
    <link rel="icon" type="image/png" href="/assets/clearwater-logo.png" />
    <link rel="stylesheet" href="signin.css?v=20260815-phone-auth" />
  </head>
  <body class="signin-body">
    <main class="signin-panel" style="min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center">
      <div>
        <img src="assets/clearwater-logo.png" alt="" width="64" height="64" />
        <p class="signin-kicker">Clearwater Phone</p>
        <h1 id="signed-in-title">Checking sign-in…</h1>
        <p class="signin-lead" id="signed-in-lead">Hold on while we confirm your Discord session.</p>
      </div>
    </main>
    <script>
      (async () => {
        const title = document.getElementById('signed-in-title');
        const lead = document.getElementById('signed-in-lead');
        try {
          const response = await fetch('/api/auth/me', { credentials: 'include', headers: { Accept: 'application/json' } });
          const me = await response.json();
          if (me && me.authenticated) {
            document.title = 'Signed in · Clearwater Phone';
            title.textContent = 'You’re signed in';
            lead.textContent = me.user && me.user.displayName
              ? `Signed in as ${me.user.displayName}. Return to the phone — this window can close on its own.`
              : 'Return to the phone. This window can close on its own.';
            return;
          }
        } catch {}
        document.title = 'Sign-in incomplete · Clearwater Phone';
        title.textContent = 'Sign-in is not complete';
        lead.textContent = 'Close this window and try Sign in with Discord again from the phone.';
      })();
    </script>
  </body>
</html>
