<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02040a" />
    <meta name="description" content="Sign in to the Pinellas County Sheriff's Office portal with Discord." />
    <title>Sign in · PCSO</title>

  <body class="signin-body">
    <div class="signin-atmosphere" aria-hidden="true">

      <span class="signin-orb signin-orb-c"></span>
      <span class="signin-grid"></span>

    <main class="signin-stage">
      <a class="signin-mark" href="/">
        <img src="assets/pcso-sheriff-star.png" alt="" draggable="false" />
        <span>PCSO</span>
      </a>
      <h1>Welcome to<br />PCSO</h1>
      <p class="signin-lead">Sign in with Discord to access the Pinellas County Sheriff&apos;s Office portal.</p>
      <form class="signin-form" data-signin-form>
        <label class="signin-agree">
          <input type="checkbox" data-legal-agree />
          <i aria-hidden="true"></i>
          <span>I agree to the <a href="/terms" target="_blank" rel="noopener">Terms of Service</a> and <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.</span>

          Continue with Discord
        </button>
      </form>
      <p class="signin-note">You must be in the PCSO Discord server to use this portal.</p>
    </main>
    <script src="signin.js?v=20260917-login"></script>

</html>
