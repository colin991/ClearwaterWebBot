<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Clearwater Roleplay is a serious ER:LC emergency-services community on Roblox, connected through Discord."
    />
    <meta name="theme-color" content="#03070d" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clearwater Roleplay" />
    <meta
      property="og:description"
      content="Play ER:LC, join Discord, and sign in to Clearwater Internet."
    />
    <meta property="og:image" content="https://cwrpvc.lol/assets/clearwater-home.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Clearwater Roleplay</title>
    <link rel="icon" type="image/png" href="assets/clearwater-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@450;550;650;750;850&display=swap" rel="stylesheet" />
    <script>document.documentElement.classList.add('js');</script>
    <link rel="stylesheet" href="styles.css?v=20260813-erlc-theme" />
    <style>html:not(.site-unlocked):not(.site-public) body { visibility: hidden; }</style>
    <script src="site-gate.js?v=20260813-coming-soon"></script>
  </head>
  <body class="home-stage">
    <a class="skip-link" href="#main">Skip to content</a>
    <aside class="site-update-banner" data-site-banner hidden>
      <div class="site-update-banner-bar">
        <div class="site-update-banner-copy">
          <p data-site-banner-message></p>
          <p class="site-update-banner-details" data-site-banner-details hidden></p>
        </div>
        <a data-site-banner-link hidden href="https://status.cwrpvc.lol/" target="_blank" rel="noopener">View status</a>
        <button type="button" class="site-update-banner-dismiss" data-site-banner-dismiss aria-label="Dismiss update">×</button>
      </div>
    </aside>

    <header class="stage-chrome" data-header>
      <a class="stage-link" href="/internet">Internet</a>
      <div class="stage-chrome-actions">
        <a class="stage-link" href="https://discord.gg/839teFCwB" target="_blank" rel="noopener">Discord</a>
        <a class="stage-link stage-link-strong" href="/signin" data-discord-login>Sign in</a>
        <div class="discord-account" data-discord-account hidden>
          <button class="discord-profile" type="button" data-discord-profile aria-expanded="false" aria-controls="discord-profile-menu">
            <img class="discord-avatar" data-discord-avatar src="assets/clearwater-logo.png" alt="" />
            <span class="discord-profile-copy"><span class="discord-name" data-discord-name>Discord user</span><span class="discord-rank" data-discord-rank hidden></span></span>
          </button>
          <button class="discord-logout" type="button" data-discord-logout>Logout</button>
          <div class="discord-profile-menu" id="discord-profile-menu" data-discord-profile-menu hidden>
            <span class="discord-profile-menu-rank" data-discord-profile-menu-rank hidden></span>
            <a href="/owner" data-owner-link hidden>Owner Panel</a>
            <a href="/internet/wallet" data-cash-balance>Wallet <span data-cash-amount>C$0</span></a>
          </div>
        </div>
      </div>
    </header>

    <main id="main" class="stage">
      <div class="stage-photo" aria-hidden="true">
        <img src="assets/clearwater-police-night.png" alt="" width="1920" height="1080" />
      </div>
      <div class="stage-veil" aria-hidden="true"></div>

      <div class="stage-content">
        <img class="stage-logo" src="assets/clearwater-logo.png" alt="" width="120" height="120" />
        <h1>Clearwater Roleplay</h1>
        <p class="stage-kicker">ER:LC on Roblox · Discord community</p>
        <p class="stage-stats" aria-live="polite">
          <span class="stage-live" aria-hidden="true"></span>
          <span><strong data-erlc-current>—</strong> / <strong data-erlc-max>50</strong> in-game</span>
          <span class="stage-stats-sep" aria-hidden="true"></span>
          <span>Queue <strong data-erlc-queue>—</strong></span>
          <span class="stage-stats-sep" aria-hidden="true"></span>
          <span><strong data-discord-count>—</strong> Discord</span>
        </p>
        <p class="stage-status"><span data-bot-connection>Checking server…</span> · <span data-time>Updated now</span></p>
        <div class="stage-actions">
          <a class="button button-primary" href="https://erlc.gg/join/cwrpvc" target="_blank" rel="noopener">Play ER:LC</a>
          <a class="button button-secondary" href="https://discord.gg/839teFCwB" target="_blank" rel="noopener">Join Discord</a>
        </div>
      </div>
    </main>

    <script src="script.js?v=20260813-erlc-theme"></script>
  </body>
</html>
